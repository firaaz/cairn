[project]
name = "cairn"
version = "0.1.0"
description = "Slice-pipeline methodology repo (hooks, slash commands, validators)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
