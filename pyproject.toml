[project]
name = "cairn"
version = "0.1.0"
description = "Slice-pipeline methodology repo (hooks, slash commands, validators)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "kuzu>=0.6",
    "mistune>=3.0",
    "typer>=0.12",
    "fastmcp>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
