  \ / pattern: \"Token budget: 150 to 400 tokens\"` block in docs/ARCHITECTURE.md\
  \ needs updating.\n- Any test that string-matches INV-008's current `type: grep\
  \ / pattern: \"def close_slice\"` block in docs/ARCHITECTURE.md needs updating.\n\
  \nOut of scope:\n- True tokenizer integration (tiktoken / Anthropic API) \u2014\
  \ D7 rejects.\n- Tier-2 admission-criteria runtime LLM-judgment binding \u2014 D5\
  \ defers.\n- Pipeline-substrate-registry changes \u2014 slice 1's territory.\n\n\
  References: docs/adr/invariant-binding-strategy.md (D4-D7); slice 1 precedent commits\
  \ 2fb83f6 (close) and fd1823e (post-close SHA substitution)."
