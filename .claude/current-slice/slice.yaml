brief: "Bind INV-002 (all three sub-clauses a/b/c) and INV-008 to true machine-checkable\
  \ assertions per docs/adr/invariant-binding-strategy.md D4-D7. Closes v1-defense-D2\
  \ at 3/3. Slice id: v1-defense-d2/inv-002-binding-implementation.\n\nScope (from\
  \ ADR D4-D7):\n\n- INV-002(a) \u2014 Add `structural-parser` validator type to scripts/validate_architecture.py.\
  \ Assertion against `.claude/handoff.md` per the D4 schema: required-sections [State,\
  \ Next, Blocked / Pending, Pointers]; optional-sections [Features]; forbidden-section-patterns\
  \ (literal \"What This Session Was About\", \"What Was Accomplished\", \"Surprises\
  \ or Discoveries\", \"Self-Check\", plus regex `^##\\s+(Lessons|Reflection|Notes)\\\
  b`); forbidden-content-patterns (regex `I (was|am|will|just) ` and `\\d+\\s*/\\\
  s*\\d+\\s+(passed|failed|tests)`); token-budget byte-approximation at 4 bytes/token\
  \ with warn-at: 360, fail-at: 440. Flip INV-002 assertion block in docs/ARCHITECTURE.md\
  \ to `type: structural-parser`.\n\n- INV-002(b) \u2014 Author tests/unit/test_catchup_tier1_list_pinned.py::test_tier1_five_items_verbatim\
  \ that pins the literal five-item Tier-1 list verbatim against commands/claude-code/catchup.full.md\
  \ (the five items per ADR D5: `.claude/handoff.md`, `.claude/current-slice/slice.yaml`,\
  \ `.claude/sweep.yaml`, `git log --oneline -5`, `git status --short`). Same test\
  \ also asserts the three Tier-2 admission criteria remain documented (structural\
  \ assertion only \u2014 Tier-2 runtime LLM-judgment binding is explicitly v2 per\
  \ D5).\n\n- INV-002(c) \u2014 Bind sub-clause (c) via `test-ref` to existing tests/unit/test_close_slice_hardened.py::test_close_slice_twice_is_noop.\n\
  \n- INV-008 \u2014 Upgrade INV-008 grep proxy on `def close_slice` to `test-ref`\
  \ pointing at the same close_slice_hardened test (D6 piggyback eliminates proxy\
  \ duplication).\n\n- ARCHITECTURE.md INV-002 + INV-008 assertion blocks updated.\
  \ binding-effective-from substitution by post-slice docs commit (mirror the INV-001\
  \ precedent at fd1823e).\n\nSubstrate landmines to enumerate BEFORE implementation\
  \ (slice 1 hit Phase-3 revert-under-RED-pressure exactly here):\n\n- tests/unit/test_invariant_assertions.py:1116\
  \ V1_ASSERTION_TYPES allowlist must include `structural-parser` (`test-ref` is already\
