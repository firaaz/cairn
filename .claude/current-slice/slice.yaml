  \  - issue-triager: claude-opus-4-7, medium\n\n2. _resolve_model_config(role: str)\
  \ -> tuple[str, str | None] helper with env-var override precedence:\n   - CAIRN_MODEL_<ROLE_UPPER_UNDERSCORE>\
  \ overrides model\n   - CAIRN_EFFORT_<ROLE_UPPER_UNDERSCORE> overrides effort\n\
  \   - Role names normalize: \"phase-3-implementer\" -> \"PHASE_3_IMPLEMENTER\"\n\
  \   - Unknown role falls back to {model: claude-opus-4-7, effort: high}\n\n3. Dispatch\
