id: compression/phase-4-sweepnotes-required
name: compression/phase-4-sweepnotes-required
status: in-progress
current_phase: 1
brief: "Enforce D2 universal phase-artifact discipline (sweep-notes.md required at\
  \ slice close) and co-land the adjacent close_slice staging-surface fix for orphaned\
  \ phase-4 writes. Primary: in scripts/slice_orchestrator.py close_slice, add a presence\
  \ check that .claude/current-slice/integration/sweep-notes.md exists on disk before\
  \ the sole slice-complete commit; fail the close with non-zero exit, clear stderr,\
  \ and orchestrator-result.json status FAILED if missing. Mechanical enforcement\
  \ of the audit follow-up phase-4-sweepnotes-required (compression design section\
  \ 9, D2 invariant). Secondary (co-landed because the edit surface is identical):\
  \ extend the close_slice _git add surface at scripts/slice_orchestrator.py:1766-1770\
  \ to cover every path declared in .claude/agents/phase-4-integrator.md:9 \u2014\
  \ specifically .claude/handoff.md, .claude/sweep.yaml, and new files under .claude/sweep-results/.\
  \ Use git add -A .claude/sweep-results/ so newly-created sweep result files are\
  \ staged safely rather than enumerated. Eliminates the orphan-artifact pattern concretely\
  \ observed in commit a8d8f23. Constrained by INV-008 DC-4 (docs/adr/slice-close-contract.md:63)\
  \ \u2014 close_slice remains the sole commit source; we are extending the add list,\
  \ not introducing new commit sites. Phase-2 writes one RED test asserting close_slice\
  \ aborts when sweep-notes.md is absent, and one RED test asserting that a modified\
  \ .claude/handoff.md or .claude/sweep.yaml lands in the slice-complete commit tree.\
  \ Out of scope: Slice C (candidate-set hygiene D3), Slice D (envelope-immutability-guard\
  \ D1), Slice F (rolling-window /status surfacing), Path C fleet-writes empirical\
  \ gap, general close_slice refactor, any phase-4-agent contract changes."
