  \ and --effort <resolved-effort> after --agent <role>.\n\n4. model_by_phase[phase]\
  \ (from Track 0 schema) must record the RESOLVED model, so cost attribution stays\
  \ honest when env-var overrides fire. Integrate with _record_phase_cost from Track\
  \ 0.\n\n5. New tests/unit/test_slice_orchestrator_model_config.py verifying:\n \
