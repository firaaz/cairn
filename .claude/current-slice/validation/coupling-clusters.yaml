# Coupling clusters for compression/slice-artifact-preservation.
# Files within a cluster change together for the same intent; clusters are
# disjoint behavioral coupling units within this slice's envelope.
clusters:
  - name: lifecycle-helper
    # Helper + its tests are tightly coupled: the test file imports
    # slice_orchestrator.lifecycle and asserts on _copy_artifacts_to_sweep_results
    # signature/side-effects + close_slice step ordering.
    files:
      - '^scripts/slice_orchestrator/lifecycle\.py$'
      - '^tests/unit/test_slice_orchestrator_artifact_preservation\.py$'

  - name: adr-architecture-prose
    # ADR D8 amends INV-008 prose; ARCHITECTURE.md is the propagated derived
    # surface. They land together so the prose surface is consistent with the
    # ADR-canonical decision set.
    files:
      - '^docs/adr/slice-artifact-preservation\.md$'
      - '^docs/ARCHITECTURE\.md$'

  - name: operator-doc-narrowing
    # ADR D5 amends start-slice.full.md:210 prose to record the new on-disk
    # archival path. Decoupled from architecture prose (different audience:
    # operator slash-command doc vs. invariant ledger).
    files:
      - '^commands/claude-code/start-slice\.full\.md$'

  - name: gitignore-directive
    # ADR D3 - .claude/sweep-results/*/artifacts/ stays gitignored. Single-line
    # directive, file-level independent of the helper, but functionally the
    # helper depends on this directive being live by close-time to avoid
    # polluting git status.
    files:
      - '^\.gitignore$'

  - name: feature-registry-entry
    # Phase-1 append of slice metadata to the compression feature registry.
    # Lives separately from production code - registry mutations follow their
    # own append-only schema.
    files:
      - '^\.claude/features/compression\.yaml$'

  - name: slice-ephemerals
    # Phase artifacts under .claude/current-slice/ - produced by the four phase
    # agents during the slice lifecycle; in-envelope as the surface this slice
    # operates over (the snapshot scope itself).
    files:
      - '^\.claude/current-slice/intent\.md$'
      - '^\.claude/current-slice/validation/approach\.md$'
      - '^\.claude/current-slice/implementation/notes\.md$'
      - '^\.claude/current-slice/integration/sweep-notes\.md$'
      - '^\.claude/current-slice/handoff-phase-[1-4]\.md$'
