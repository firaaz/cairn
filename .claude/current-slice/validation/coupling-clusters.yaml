clusters:
  - name: bootstrap
    files:
      - '^pyproject\.toml$'
      - '^\.gitignore$'
      - '^scripts/cairn_query/__init__\.py$'
      - '^scripts/cairn_query/extractors/__init__\.py$'

  - name: typed-models
    files:
      - '^scripts/cairn_query/models\.py$'
      - '^tests/unit/test_cairn_query_models\.py$'

  - name: graph-storage
    files:
      - '^scripts/cairn_query/schema\.py$'
      - '^scripts/cairn_query/storage\.py$'
      - '^tests/unit/test_cairn_query_schema\.py$'
      - '^tests/unit/test_cairn_query_storage\.py$'
      - '^tests/unit/test_snapshot_lru\.py$'

  - name: extractor-protocol
    files:
      - '^scripts/cairn_query/extractors/base\.py$'
      - '^tests/unit/test_extractor_base\.py$'

  - name: per-entity-extractors
    files:
      - '^scripts/cairn_query/extractors/invariant\.py$'
      - '^scripts/cairn_query/extractors/decision\.py$'
      - '^scripts/cairn_query/extractors/lesson\.py$'
      - '^scripts/cairn_query/extractors/spec_section\.py$'
      - '^scripts/cairn_query/extractors/op_rule\.py$'
      - '^scripts/cairn_query/extractors/feature\.py$'
      - '^scripts/cairn_query/extractors/slice\.py$'
      - '^tests/unit/test_extractor_invariant\.py$'
      - '^tests/unit/test_extractor_decision\.py$'
      - '^tests/unit/test_extractor_lesson\.py$'
      - '^tests/unit/test_extractor_spec_section\.py$'
      - '^tests/unit/test_extractor_op_rule\.py$'
      - '^tests/unit/test_extractor_feature\.py$'
      - '^tests/unit/test_extractor_slice\.py$'

  - name: public-api-and-cli
    files:
      - '^scripts/cairn_query/__init__\.py$'
      - '^scripts/cairn_query/__main__\.py$'
      - '^scripts/cairn_query/validators\.py$'
      - '^tests/unit/test_path_binding\.py$'
      - '^tests/unit/test_cli_query\.py$'
      - '^tests/unit/test_round_trip_validator\.py$'

  - name: docs-and-registry
    files:
      - '^docs/operational-reference\.md$'
      - '^\.claude/features/compression\.yaml$'
