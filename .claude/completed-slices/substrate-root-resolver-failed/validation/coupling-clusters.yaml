clusters:
  - name: root-resolver-core
    files:
      - '^scripts/_root\.py$'
      - '^tests/unit/test_root\.py$'
  - name: orchestrator-paths
    files:
      - '^scripts/slice_orchestrator/core\.py$'
      - '^scripts/slice_orchestrator/lifecycle\.py$'
      - '^scripts/slice_orchestrator/dispatch\.py$'
      - '^scripts/slice_orchestrator/telemetry\.py$'
      - '^scripts/slice_orchestrator/git\.py$'
  - name: cairn-query-paths
    files:
      - '^scripts/cairn_query/__init__\.py$'
      - '^scripts/cairn_query/__main__\.py$'
      - '^scripts/cairn_query/validators\.py$'
      - '^scripts/cairn_query/extractors/.*\.py$'
  - name: snapshot-diff
    files:
      - '^scripts/snapshot_diff\.py$'
  - name: mcp-server
    files:
      - '^mcp_servers/cairn_knowledge/server\.py$'
  - name: lint-gate
    files:
      - '^scripts/lint_paths\.py$'
      - '^scripts/validate_architecture\.py$'
      - '^tests/unit/test_path_discipline_lint\.py$'
      - '^tests/unit/test_root_resolver_migration\.py$'
  - name: docs
    files:
      - '^docs/operational-reference\.md$'
