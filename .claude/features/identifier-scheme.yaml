id: identifier-scheme
intent: "Establish ID + Name schema across ADRs/slices/decisions/features. Supersede ADR-005. Migrate existing entities. Fleet-coordinator Feature 1 (IDs + Names combined; state taxonomy deferred to its own feature)."
created: 2026-04-15
shaped-from: docs/plans/2026-04-15-identifier-scheme-design.md

# Bootstrap-window constraint (Phase 2 Skeptic finding, 2026-04-15):
# scheme-adr writes the first flat-slug ADR (`docs/adr/identifier-scheme.md`).
# `reversibility-guard.sh` clauses match only `*/docs/adr/[0-9]*`, so flat-slug
# ADRs are unprotected by the append-only enforcement until hook-tolerance lands.
# CONSTRAINT: hook-tolerance MUST be the immediately-next slice in this feature.
# No other flat-slug ADRs may be authored between scheme-adr close and
# hook-tolerance close.
slices:
  - id: identifier-scheme/scheme-adr
    slice-yaml-id: SLICE-015
    added: 2026-04-15
  - id: identifier-scheme/hook-tolerance
    slice-yaml-id: SLICE-016
    added: 2026-04-15
    after: identifier-scheme/scheme-adr
    intent: "Update scope-guard.sh, reversibility-guard.sh, reality-check.sh to accept both legacy numeric-prefix and new flat-slug formats. Closes the bootstrap-window gap left by scheme-adr."
  - id: identifier-scheme/hook-relpath-bypass
    slice-yaml-id: SLICE-018
    added: 2026-04-16
    after: identifier-scheme/hook-tolerance
    intent: "Normalize tool-input paths in reversibility-guard.sh so bare-relative (docs/adr/foo.md) and .slice-system/-prefixed forms cannot bypass ADR append-only protection. Follow-on to hook-tolerance: extends INV-005 tolerance from filename shape to input path shape."
  - id: identifier-scheme/validator-flat-slug
    slice-yaml-id: SLICE-018
    added: 2026-04-16
    after: identifier-scheme/hook-tolerance
    intent: "Widen scripts/validate_architecture.py to recognize flat-slug ADR filenames (docs/adr/<id>.md) and flat-slug IDs in ARCHITECTURE.md invariant references, alongside legacy NNN-slug.md. Closes the substrate gap named in ARCHITECTURE.md's 'Current Phase Constraints § Identifier scheme' paragraph so INV-005 can cite `identifier-scheme` directly instead of via the ADR-006 proxy."
