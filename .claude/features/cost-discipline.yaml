id: cost-discipline
name: "Cost discipline — measurement infrastructure and per-phase model levers"
intent: "Close cairn per-slice cost-spend gap. Track 0 (telemetry + new advisory invariant INV-009) lands first because nothing downstream is measurable without it; Lever 1 (per-phase model config defaulting Sonnet on phases 3/4) follows as a separate slice once Track 0 makes its effect observable. Out of program scope: Lever 2 (compression — separate track), Track B (lightweight-slice escape hatch — separate strategic track), --max-budget-usd hard-cap plumbing (deferred per design OQ#3)."
shaped-from: docs/plans/2026-04-23-cost-discipline-design.md
created: 2026-04-24
slices:
  - id: cost-discipline/track-0-telemetry
    added: 2026-04-24
    intent: "Add per-phase token-usage and dollar-cost telemetry to scripts/slice_orchestrator.py: seven additive fields in _init_state_dict (tokens_by_phase, cost_by_phase_usd, model_by_phase, tokens_total, cost_total_usd, pricing_snapshot + dated PRICING_TABLE constant), --output-format json on the dispatch site at :984-992, idempotent _record_phase_cost(phase, tokens, model) helper, Cost section in <slug>-result.md projection, new ADR docs/adr/cost-per-slice-budget.md introducing INV-009 (provisional, advisory-only at intro, X/Y thresholds TBD pending baseline), ARCHITECTURE.md INV-009 entry + invariant-check block, operational-reference docs for PRICING_TABLE dating + advisory semantics, /status one-line per-slice cost surfacing in status.md and status.full.md. schema_version NOT bumped (additive-only per orchestrator-observability D4). Preconditions: smoke-test claude -p --output-format json envelope shape gates Phase 2 acceptance. Preserves INV-003 (phase contracts unchanged), INV-004 (status output bounded), INV-006 (feature file always-create), INV-008 (close_slice untouched). Out of scope: Lever 1 model config, Lever 2 compression, Track B hatch, --max-budget-usd plumbing, hard-fail INV-009, cumulative /status totals, multi-vendor pricing tables, AST/grep anchoring for INV-009 (waits on cliff-failure-mode-and-v1-defenses D2), schema_version bump, close_slice edits, agent-prompt changes, new commit sites."
  - id: cost-discipline/lever-1-per-phase-model
    added: 2026-04-24
    after: [cost-discipline/track-0-telemetry]
    intent: "Land per-phase model configuration: AGENT_MODEL_CONFIG dict in scripts/slice_orchestrator.py defaulting phases 1/2 (writer, skeptic) to claude-opus-4-7 high-effort and phases 3/4 (implementer, integrator) to claude-sonnet-4-6 (medium / low effort respectively); _resolve_model_config(role) helper with env-var override precedence (CAIRN_MODEL_<ROLE> > CAIRN_EFFORT_<ROLE> > dict default); dispatch plumbing at :984-992 splices --model and --effort args after --agent <role>; model_by_phase[phase] (from Track 0 schema) records the resolved model so cost attribution stays honest under env-var overrides; new tests/unit/test_slice_orchestrator_model_config.py verifies default resolution + env-var override + dispatch flag passing; operational-reference documents the new env-var family alongside existing CAIRN_<KNOB> pattern. No new ADR (knob, not structural change). Validation event: comparison run (default config vs CAIRN_MODEL_PHASE_3_IMPLEMENTER=claude-opus-4-7 CAIRN_MODEL_PHASE_4_INTEGRATOR=claude-opus-4-7 parity) shows >=30 percent cost reduction on phases 3+4 in the resulting <slug>-result.json files. Out of scope: Lever 2 compression, Track B hatch, agent-prompt edits (agent content stays model-agnostic), per-slice model overrides (premature)."
