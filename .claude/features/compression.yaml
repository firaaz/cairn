id: compression
name: "Slice compression — orchestrator-driven phase dispatch"
intent: "Ship compression protocol: orchestrator (Python state machine) dispatches role-scoped phase agents via claude -p; two-layer enforcement (allowed-tools + role_guard.py); D1/D2/D3 universal phase-artifact discipline. Subsumes efficiency-program Part 3 S1+S2; supersedes Part 2 E2 in original form; implements Part 2 E6. Slice A reshaped at kickoff to absorb identifier-scheme carry-over debt (F1 ADR prose audit + F2 test_phase_rethink rekey); infrastructure scope moves to a later slice."
shaped-from: docs/plans/2026-04-18-slice-compression-protocol-design.md
created: 2026-04-18
slices:
  - id: compression/doc-cleanup-tail
    added: 2026-04-18
    intent: "Slice A (reshaped): close identifier-scheme carry-over debt. F1 — audit 7 sweep-#17 ADRs for factually-stale legacy-identifier residue and rewrite via ADR_EDITORIAL_FIX=1 where found; leave pedagogical/historical prose alone. F2 — rekey COMPLETED_SLICES in tests/unit/test_phase_rethink.py to canonical slice-names and make the matcher wording-agnostic. Out of scope: Part 0 ADR (Slice B), orchestrator infrastructure (later slice), any ADR outside the sweep-#17 set."
  - id: compression/infrastructure
    added: 2026-04-19
    intent: "Slice A of the compression program proper: ship scripts/slice_orchestrator.py (Python state machine), four phase-role agents + issue-triager, checks/role_guard.py PreToolUse hook, thin /start-slice refactor with --legacy escape hatch, and settings.json hook registration. Closes under legacy serial protocol; the compressed dispatch path it installs becomes the dogfood target for Slice B (Part 0 ADR). Audit-finding F1/F3/F4/F5 prevention mechanisms are present-by-construction but exercised only by Slice B's compressed execution. Authorized by compression-infrastructure-bootstrap; Part 0 ratification deferred to Slice B."
  - id: compression/orchestrator-hardening
    added: 2026-04-19
    intent: "Fix the three orchestrator defects surfaced by housekeeping/post-slice-a-tidy's dogfood run: (1) BLOCKER `--permission-mode` missing from dispatch_agent subprocess command, auto-denying inner Write/Edit; (2) BLOCKER brief text lost between init_new_slice and run_phase_loop, so Phase 1 writer runs without user intent; (3) LOW test_slice_orchestrator_state_machine tests couple to real slice.yaml. Ships on legacy serial protocol (bootstrap — fixing the compressed dispatcher itself); the resulting compressed path is ready for the next slice to dogfood. Out of scope: findings #3 (stderr), #4 (writer feature-scan), #5 (envelope schema); sweep #20 stale-test Findings §1/§3."
  - id: compression/slice-1-foundation
    added: 2026-04-20
    intent: "Foundation slice of the pipeline-hardening program (design doc 2026-04-20-compression-pipeline-hardening-design.md section 5). Resolve A1 (subagent sensitive-file gate on .claude/current-slice/**) via three-spike empirical test, commit to Path X (settings/flags) or Path Y (orchestrator-owned artifact writes) per spike outcome. Wire checks/role_guard.py into .claude/settings.json as PreToolUse hook for Write|Edit|MultiEdit|NotebookEdit (A3). Split dispatch_agent into dispatch_phase_agent / dispatch_triager with distinct return contracts (B1, B17). Extend _parse_structured_tail to accept multi-line pretty JSON tails via brace-balanced backward scan (B5). Replace capture_output with Popen tee-pump streaming child stderr live with [phase-N-role|slice-id] prefix (D3 brought forward). Rename debug log filenames to <slice-id-slug>-phase-<n>-<role>-<timestamp>.log. Exit when a trivial slice runs all four phases autonomously via the orchestrator, exits 0, produces sweep-notes.md. Out of scope: Slices 2 and 3 of the hardening program (state-machine, serialization, multi-instance, result JSON, indexed logs)."
  - id: compression/slice-2-state-machine
    added: 2026-04-20
    intent: "Slice 2 of the pipeline-hardening program (design doc 2026-04-20-compression-pipeline-hardening-design.md §6). Close the orchestrator code-bug backlog covering state-machine durability (B10 close_slice integration on OK-from-Phase-4, B12 fail-loud on malformed slice.yaml, B13 SIGINT/SIGTERM clean-shutdown handler, B14 RE_DISPATCH persists current_phase before continue, B15 max-1 redispatch-per-phase cap), git reconciliation (B11 _git helper asserts returncode==0, B9 post-TimeoutExpired HEAD reconciliation against pre-dispatch HEAD), serialization (B3/B4 yaml.safe_load/safe_dump for brief+name round-trip, B6 PyYAML + schema-validated cluster parsing, B7 AGENT_ENVELOPE encoded as JSON list parsed by role_guard via json.loads), and phase-3 robustness (B16 empty-cluster guard with intent-envelope fallback, B2 per-cluster log capture even on fast-fail, B8 FAILED classification — transient/malformed/logic — with exponential backoff). One regression test per bug. PyYAML dep already added in Slice 1. Out of scope: Slice 3 multi-instance + observability (E1 lockfile, E2 PID-scoped role_guard, D1 indexed debug logs, D3 orchestrator-result.json, parallel-worktree integration test); Path Y/C agent-return-with-artifacts contract redesign (tracked separately after the A1 nested-context empirical gap observed 2026-04-20)."
  - id: compression/triager-superseded-test-heuristic
    added: 2026-04-21
    intent: "Iterate dispatch_triager + issue-triager prompt so a RAISE_ISSUE naming tests superseded by a firm contract the current slice just landed routes to ESCALATE_TO_USER instead of RE_DISPATCH-to-Phase-2. Pattern observed in compression/slice-3-observability-and-close-slice (memory triager_misroute_on_superseded_tests.md; concrete log compression-slice-3-observability-and-close-slice-phase-3-phase-3-implementer-20260420T194707Z.log). Scope: (1) new pure function detect_superseded_test_signal(summary, intent_text) in scripts/slice_orchestrator.py triggered by tokens supersede/superseded, INV-NNN (three-digit), and DC-N AND-gated on current-slice intent.md; (2) dispatch_triager reads the RAISE_ISSUE commit body via _git, reads current slice intent.md, and appends advisory supersession_hint to the triager inputs JSON; (3) one-sentence amendment to .claude/agents/issue-triager.md telling the triager to prefer ESCALATE_TO_USER with test-amendment-recommended rationale when the hint fires; (4) one-paragraph note in docs/operational-reference.md near the Phase Skill Guide. One new Phase-2 regression file tests/unit/test_triager_superseded_heuristic.py. No new ADR (single-incident prompt iteration; provisional ADR deferred until a second incident or the heuristic becomes an override). Out of scope: Path C empirical gap, compression slices C/D/F, general triager refactor, RE_DISPATCH cap (B15) tuning, adding/removing triager actions."
  - id: compression/phase-4-sweepnotes-required
    added: 2026-04-23
    intent: "Mechanical enforcement of audit follow-up phase-4-sweepnotes-required (compression design §8 D2, INV-008 DC-4). Two co-landed edits in scripts/slice_orchestrator.py close_slice only: (1) presence check that .claude/current-slice/integration/sweep-notes.md exists on disk before the sole slice: complete commit — absent → non-zero exit, stderr error, orchestrator-result.json status: FAILED with stable reason token, no stage/commit/wipe; (2) extend _git add surface at scripts/slice_orchestrator.py:1766-1770 to cover every path declared by .claude/agents/phase-4-integrator.md:9 — .claude/handoff.md, .claude/sweep.yaml, and .claude/sweep-results/ via git add -A (eliminates orphan-artifact pattern seen in commit a8d8f23). INV-008 DC-4 preserved: no new commit sites, close_slice remains sole producer of slice: complete; D1 idempotency preserved via _is_slice_already_closed short-circuit gating the presence check; D3 wipe and D4 resume matrix untouched. Out of scope: agent-prompt rewrites, ADR edits, general close_slice refactor, Slice C candidate-set hygiene (D3), Slice D envelope-immutability-guard (D1), Slice F rolling-window /status surfacing, Path C fleet-writes empirical gap, .claude/sweep-results/ content or schema."
  - id: compression/phase-1-handoff-stage-surface
    added: 2026-04-23
    intent: "Phase-1 symmetric analog of Slice E. Extend scripts/slice_orchestrator.py:commit_phase_handoff (lines 1441-1452) to stage the phase-1-writer's full declared write surface — BOTH .claude/current-slice/intent.md AND .claude/features/<feature>.yaml — alongside the existing handoff-phase-N.md stage. Per .claude/agents/phase-1-writer.md:9, both paths are the declared Phase-1 writes; today commit_phase_handoff stages only handoff-phase-N.md, producing chronic orphans: intent.md (evidence 8e619c3 amendment, 513b0de recovery, a3729cb manual persistence, f2ab0f3 seed) and .claude/features/<feature>.yaml (evidence a8d8f23 and dbea33c chore tail-commits). Feature-id resolves from slice.yaml id via the existing _slice_id() helper (segment before /). Each new stage guarded by `if path.exists(): _git(\"add\", str(path))` mirroring the existing pattern so Phases 2/3/4 remain no-ops by construction (those phases do not touch either path) and Phase-4's orchestrator-code skip at max_phase (INV-008 DC-4 primary enforcement) means this code never fires at the Phase-4 boundary. INV-008 DC-4 preserved: commit_phase_handoff remains a per-phase handoff-boundary staging function producing `handoff: phase N complete` commits only; close_slice remains sole `slice: complete` producer; no new commit sites introduced. INV-003 preserved: phase-1-writer agent contract unchanged; only the orchestrator's staging surface is brought into alignment with the agent's already-declared write surface. Mirror Slice E edit discipline — additive stage-list extension, not a rewrite; no `git add -A`; no file creation; no mkdir. Phase-2 writes FOUR RED tests: R1a intent.md stages when present, R1b features-file stages when present, R2a no-op when intent.md absent, R2b no-op when features-file absent. Out of scope: Slice C F2/candidate-set hygiene (pending /decision), close_slice edits (Slice E landed those), init_new_slice edits (distinct commit site — owns slice.yaml only), phase-1-writer agent-contract changes (.md:9 authoritative), feature-file or intent schema edits, generalised git add -A rewrites, Slice D envelope-immutability-guard (D1), Slice F rolling-window /status surfacing, Path C fleet-writes empirical gap, any new commit sites."
  - id: compression/lever-2-orchestrator-split
    added: 2026-04-25
    intent: "Compression Lever 2 (Part-8 §5/§10/§13.1 H2). Split the 2240-line scripts/slice_orchestrator.py monolith into a hexagonal package scripts/slice_orchestrator/{__init__,__main__,core,dispatch,lifecycle,resume,telemetry,git}.py. Pure structural refactor: zero behavioral diff, zero test-file edits, 746/746 pytest pass at close. Backward-compat surface preserved by __init__.py re-exports — every name currently top-level on slice_orchestrator (is_valid_slice_id, read_slice_state, dispatch_phase_agent, dispatch_triager, dispatch_phase_3, detect_superseded_test_signal, commit_phase_handoff, run_phase_loop, init_new_slice, close_slice, legacy_start_slice, main, AGENT_MODEL_CONFIG, INV_009_COST_THRESHOLD_USD, INV_009_TOKEN_THRESHOLD, PRICING_TABLE_*, ROLE_FOR_PHASE, ROLE_TO_PHASE, DEBUG_DIR, DEFAULT_TIMEOUT_HARD, PERMISSION_MODE, VALID_TRIAGER_ACTIONS, SLICE_ID_REGEX, _HeartbeatDaemon, plus the underscore-prefixed helpers test files reach into) keeps `import slice_orchestrator as so; so.<name>` resolving identically. CLI entry-point `python -m slice_orchestrator` (and the path form invoked by /start-slice) preserved with the same --brief/--resume/--legacy arg surface. Path-string updates in commands/claude-code/start-slice.md, commands/claude-code/start-slice-legacy.md, docs/operational-reference.md (env-var Source column), and docs/ARCHITECTURE.md (invariant-check `target:` blocks) are in-envelope and required for accuracy after the path change. ADRs are append-only and out-of-envelope: their historical scripts/slice_orchestrator.py:NNN citations stay frozen by design. Estimated $3-5 / slice savings (180-300k cache_creation cut on orchestrator-touching slices) — measured on the next orchestrator-touching slice via Track-0 result.json. Out of scope: any test-file edit (a test diff signals broken refactor), invariant-comment colocation in code (H3 — separate slice), test-mirror restructure (H4 — gradual discipline), per-phase orientation (M0 — Lever 3, follows this), API digests (M0.5 — Lever 4), Read-cap and Bash-cap prompt prefixes (M3+M2 — Lever 5), subagent dispatch discipline (S1+S3 — Lever 6), doc-port layer (H1 — deferred until 2-3 adapters exist), L-008/L-009 follow-ons, sweep.yaml control keys, Slice C/D/F compression work, ADR file edits."
  - id: compression/slice-artifact-preservation
    added: 2026-04-26
    intent: "Operationalizes ADR slice-artifact-preservation (firm, 2026-04-26): adds a pre-wipe copy step in scripts/slice_orchestrator/lifecycle.py:close_slice that snapshots phase ephemerals (intent.md, validation/approach.md, implementation/notes.md, integration/sweep-notes.md, handoff-phase-{1..4}.md, envelope-expansions.log, and the pre-close slice.yaml text) to .claude/sweep-results/<slug>/artifacts/ before DC-5 wipes .claude/current-slice/. New private helper _copy_artifacts_to_sweep_results(slice_id, pre_close_yaml_text) runs between Step 2 (bundle) and Step 3 (wipe); pre-close slice.yaml text captured in memory at new Step 0.5 before Step 1 mutates status=complete. Two-tier failure handling per ADR D6/D7: missing source files skip silently (F5-tolerance, mirrors _wipe_current_slice posture); operational OSError (ENOSPC/EACCES on copyfile, makedirs, write_text) propagates and aborts the close before the wipe destroys originals. .gitignore gains .claude/sweep-results/*/artifacts/ directive (D3 on-disk-only, not committed). commands/claude-code/start-slice.full.md:210 prose narrowed from 'no archive directory for successful slices' to 'no archive directory for committed history' plus a sentence noting the new on-disk preservation surface (D5). docs/ARCHITECTURE.md:75 INV-008 prose amended to declare a fourth separately-testable property (d) describing the new copy step; the invariant-check grep target def close_slice is intentionally NOT touched (D8 preserves it). Co-lands docs/adr/slice-artifact-preservation.md in the Phase-3 commit alongside the lifecycle.py change. Sibling slice — runs in parallel with substrate Slice 1 (compression/lever-X-knowledge-index) under parallelism-v1; envelopes are disjoint. INV-008 DC-3 idempotency, DC-4 sole-commit-source (helper performs no _git calls), DC-5 explicit wipe, DC-7 slug-keyed observability all preserved by construction. Phase 2 ships nine RED tests in tests/unit/test_slice_orchestrator_artifact_preservation.py covering D1 ordering, D2 byte-identity for all 9 artifact paths, D2.vii pre-close-yaml capture timing (status: in-progress, NOT status: complete), D6a idempotency, D6b F5-tolerance, and D7 two-tier loud-fail on copyfile/makedirs OSError. Out of scope: any change to scripts/slice_orchestrator/ outside lifecycle.py, any extractor or substrate-side change (substrate slices own that), .claude/sweep-results/ compaction policy (D4 parks it), commit-vs-gitignore reconsideration (D3 defers to extraction time), existing test_close_slice_*.py files (additive imports only if Phase 3 surfaces a need), the INV-008 grep target, .claude/agents/phase-*.md, and any new ADR beyond slice-artifact-preservation."
  - id: compression/lever-x-knowledge-index
    added: 2026-04-26
    intent: "Slice 1 of the knowledge-substrate program (design doc 2026-04-25-knowledge-substrate-design.md). Ship scripts/cairn_query/ — extractor (markdown → pydantic typed records) + kuzudb-backed graph storage + cairn_query CLI (typer) + CI round-trip validator. Operator-only consumer; no FastMCP server, no agent integration. Seven entity types (Invariant/Decision/Lesson/SpecSection/OpRule/Feature/Slice) plus the BINDS path-binding inverse view. Closes when full pytest passes, CI validator round-trips the current corpus, and cairn_query path-bindings <known-path> returns correct records for ≥3 sampled paths. Out of scope: FastMCP adapter (Slice 2), phase-agent integration (Slice 2/3), pre-wipe artifact preservation (sibling slice), ADR creation (cairn-substrate-and-fastmcp lands in Slice 2). Sibling-slice with compression/slice-artifact-preservation under parallelism-v1; envelopes disjoint."
  - id: compression/learnings-capture
    added: 2026-04-26
    retry-of: "compression/learnings-capture (failed 2026-04-26; archived at .claude/completed-slices/compression-learnings-capture-failed/, archive commit 4fc3157)"
    intent: "RETRY of compression/learnings-capture (prior attempt failed at B15 cap; root cause = Phase-3 prompt-amendment cluster ran without a RED test and reported OK on vacuous GREEN status). Restore the per-slice learning-capture surface that the compressed protocol structurally lost (legacy single-CC-session captured operator-noticed patterns mid-flight; today's orchestrator + subagent-phase model has no equivalent capture point — L-010 only existed via post-close forensic exploration). Two layered surfaces, both archived by slice-artifact-preservation: (1) Phase-4 integrator emits an optional `## Learnings observed` subsection in sweep-notes.md (free-form prose, judgment-based, empty by default); (2) orchestrator emits mechanical events to `.claude/current-slice/integration/orchestrator-events.jsonl` via new `_record_orchestrator_event(slice_id, event_type, **fields)` in core.py — v1 emission sites: phase_redispatch, redispatch_cap_exceeded, cost_threshold_breach, token_threshold_breach, agent_timeout. Schema: `{ts: ISO8601-UTC, slice_id, event_type, ...fields}`. Wiring: `_ARTIFACT_RELPATHS` in lifecycle.py gains `integration/orchestrator-events.jsonl` (one tuple entry); `_copy_artifacts_to_sweep_results` F5-tolerance (ADR D6) silently handles zero-events case. Phase-4 integrator prompt amendment is markdown-only — additive template element, no new instruction, no expanded write surface. INV-008 (DC-3/4/5/7) and INV-003 (phase-lock) preserved by construction; helper performs no _git calls (DC-4 by construction); only Phase-4 prompt touched (INV-003 by construction). Cluster-RED-test discipline (the retry's distinguishing constraint): every Phase-3 cluster carries a RED test, including the prompt-amendment cluster — Phase 2 ships ~7 RED tests in tests/unit/test_orchestrator_events_capture.py PLUS 2 string-presence RED tests in tests/unit/test_phase_4_integrator_prompt.py (brittleness explicitly accepted as the price of progress signal that GREEN cannot vacuously satisfy). Seed: stash@{0} (partial Phase-3 orphan from cost-discipline/lever-1-tier-retune; carve carefully — was scope-drift not vetted spec). stdlib-only (json, datetime.timezone.utc). Predecessor: compression/slice-artifact-preservation (closed, b846652) — provides the archival pipeline. Successor: substrate Slice 2 (compression/lever-Y-mcp-substrate) opens AFTER this closes so its first run exercises the new capture surfaces. Out of scope: per-phase-1/2/3 learning surfaces (deferred until Phase-4 + events surface proves insufficient); automatic 3×-rule promotion to docs/lessons.md (operator-driven workflow stays manual); post-close commit detection (L-010 WS1 fixup-after-close pattern — orchestrator can't observe inline); empty-handoff-commit detection (L-008); .claude/learning.md V5 cap revision; new ADR (mechanism addition only); any phase-1/2/3 agent-prompt change (Phase-4 only); source-rewrite of orchestrator modules outside the v1 emission-site table."
  - id: compression/lever-Y-mcp-substrate
    added: 2026-04-26
    intent: "Substrate Slice 2: wrap scripts/cairn_query/ in a FastMCP stdio server (mcp_servers/cairn_knowledge/, 4 read-only tools) so phase-1-writer queries typed records instead of re-reading canonical markdown. Co-lands ADR cairn-substrate-and-fastmcp (already committed). Adds .mcp.json registration, snapshot pinning via AGENT_ENVELOPE.cairn_query_snapshot (git rev-parse HEAD per ADR D12), checks/role_guard.py ROLE_DENY_READ table covering scripts/cairn_query/** + canonical knowledge sources for phase-1-writer (ADR D8) with envelope-grant escape (D9), phase-1-writer agent prompt query-first directive + tools-frontmatter tightening. POC scope: phase-1-writer only; Slice 3 generalizes to phases 2/3/4. Cost target ≥40% Phase-1 reduction vs Lever-1 baseline ($2.96 / 105k cache_creation)."
  - id: compression/lever-Y-mcp-substrate-fixup
    added: 2026-04-26
    intent: "Fix three substrate defects from compression/lever-Y-mcp-substrate (roadmap §12) so the Slice 2 substrate is functional in practice and Slice 3 can open. (1) mcp_servers/cairn_knowledge/server.py replaces the _stdin_reader stub with a real JSON-RPC 2.0 dispatcher over stdio (initialize/tools/list/tools/call per MCP spec referenced by ADR D6) wrapping the four callables in tools.py; snapshot pinning via AGENT_ENVELOPE.cairn_query_snapshot preserved. (2) pyproject.toml [project] dependencies adds fastmcp per ADR cairn-substrate-and-fastmcp D1 standing dep set; uv.lock regenerated. (3) checks/role_guard.py READ_CLASS_TOOLS extended from {Read} to {Read, Grep, Glob} so phase-1-writer cannot bypass canonical-knowledge lockdown via Grep/Glob; .claude/agents/phase-1-writer.md frontmatter drops Grep+Glob (defense-in-depth outer gate). Phase-2 tests harden from boot-liveness to JSON-RPC round-trip (new tests/unit/test_mcp_cairn_knowledge_jsonrpc.py R1-R5; new tests/unit/test_role_guard_grep_glob_deny.py G1-G7). docs/ARCHITECTURE.md INV-010 prose names Grep/Glob in deny surface; invariant-check `target:` block unchanged. Operationalizes existing ADR D1/D6/D8; no new ADR. Phase 1 drafted via prose protocol (operator-interactive session) because the broken substrate would corrupt orchestrator-driven phase-1-writer dispatch. Phases 2-4 dispatch via in-session subagents (phase-2-skeptic / phase-3-implementer / phase-4-integrator) since orchestrator --resume reconciler will not accept hand-rolled phase-1-done state. Out of scope: phases 2/3/4 lockdown extension (Slice 3 — compression/lever-Z-substrate-full-pipeline), mutation surface (ADR D7 deferred), AGENT_ENVELOPE schema changes (Slice 2 already shipped object shape), Bash deny widening (cat/head/grep tokens already covered via _bash_path_tokens), INV-010 invariant-check `target:` block, scripts/cairn_query/** internals, scripts/slice_orchestrator/dispatch.py AGENT_ENVELOPE construction (Slice 2 wired), any new ADR."
  - id: compression/lever-Z-substrate-full-pipeline
    added: 2026-04-26
    intent: "Substrate Slice 3 (knowledge-substrate design doc 2026-04-25 §348). Extend query-first lockdown from phase-1-writer (Slice 2 + Slice 2 fixup, both closed) to phase-2-skeptic, phase-3-implementer, and phase-4-integrator per ADR cairn-substrate-and-fastmcp D8 second-stage rollout — completes the substrate's structural enforceability across all four phase roles. Ships: (1) phase-2/3/4 agent prompt updates directing query-first consumption of canonical knowledge via cairn-knowledge MCP (lookup/search/path_bindings/cypher) instead of direct markdown reads; (2) checks/role_guard.py ROLE_DENY_READ extended to cover phase-2-skeptic, phase-3-implementer, and phase-4-integrator with the same deny set as phase-1-writer (canonical knowledge sources: docs/ARCHITECTURE.md, docs/adr/**, docs/lessons.md, docs/spec-v1.md, docs/operational-reference.md; substrate internals: scripts/cairn_query/**) with envelope-grant escape (D9) preserved; (3) .claude/agents/phase-2-skeptic.md, phase-3-implementer.md, phase-4-integrator.md frontmatter tightened to drop direct read access to the locked-down sources (defense-in-depth outer gate); (4) phase-4-integrator integrates typed invariant_check_results consumption — reads structured evidence from the substrate instead of running each invariant check via grep-on-source by hand (substrate already exposes invariant records); (5) sweep-notes template generation from typed records — phase-4-integrator emits invariant-evidence rows pre-filled from substrate query rather than hand-typed citations. Closes when: (a) full-slice cost re-measured against the $18.71 Lever-1 baseline shows ≥50% total stacked reduction (per design §348 cost target), (b) sweep-notes template correctly fills invariant-evidence rows from substrate query on this slice's own Phase-4 run (dogfood), (c) docs/ARCHITECTURE.md INV-010 prose names phases 2/3/4 in the deny surface (invariant-check `target:` grep stays at ROLE_DENY_READ literal — the constant's set widens, the name does not), and (d) full pytest GREEN modulo the pre-existing INV-004 turn-1 token-budget OOS env-dependent failure. Operationalizes existing ADR cairn-substrate-and-fastmcp D6/D8/D9; no new ADR (D8 already authorizes second-stage rollout to phases 2/3/4). Predecessor: compression/lever-Y-mcp-substrate-fixup (closed 9b71cfa) — provides the functional substrate. First slice to dogfood the orchestrator-driven query-first dispatch end-to-end across all four phases. Out of scope: mutation surface (ADR D7 explicit deferral; v1 stays read-only), AGENT_ENVELOPE schema changes (Slice 2 already shipped the object shape with paths/cairn_query_snapshot keys), Bash read-class deny widening (cat/head/grep tokens already covered via _bash_path_tokens in role_guard.py), INV-010 invariant-check `target:` block (grep target stays ROLE_DENY_READ literal), scripts/cairn_query/** internals (substrate Slice 1 territory; consumed via public callables), mcp_servers/cairn_knowledge/** internals (Slice 2 + fixup territory; consumed via JSON-RPC), scripts/slice_orchestrator/dispatch.py AGENT_ENVELOPE construction (already wired for phases 1-4), substrate Slice 4+ (not yet designed), per-phase MCP tool surface differentiation (all four phases share the same four-tool surface), any new ADR."
