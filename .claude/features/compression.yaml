id: compression
name: "Slice compression — orchestrator-driven phase dispatch"
intent: "Ship compression protocol: orchestrator (Python state machine) dispatches role-scoped phase agents via claude -p; two-layer enforcement (allowed-tools + role_guard.py); D1/D2/D3 universal phase-artifact discipline. Subsumes efficiency-program Part 3 S1+S2; supersedes Part 2 E2 in original form; implements Part 2 E6. Slice A reshaped at kickoff to absorb identifier-scheme carry-over debt (F1 ADR prose audit + F2 test_phase_rethink rekey); infrastructure scope moves to a later slice."
shaped-from: docs/plans/2026-04-18-slice-compression-protocol-design.md
created: 2026-04-18
slices:
  - id: compression/doc-cleanup-tail
    added: 2026-04-18
    intent: "Slice A (reshaped): close identifier-scheme carry-over debt. F1 — audit 7 sweep-#17 ADRs for factually-stale legacy-identifier residue and rewrite via ADR_EDITORIAL_FIX=1 where found; leave pedagogical/historical prose alone. F2 — rekey COMPLETED_SLICES in tests/unit/test_phase_rethink.py to canonical slice-names and make the matcher wording-agnostic. Out of scope: Part 0 ADR (Slice B), orchestrator infrastructure (later slice), any ADR outside the sweep-#17 set."
  - id: compression/infrastructure
    added: 2026-04-19
    intent: "Slice A of the compression program proper: ship scripts/slice_orchestrator.py (Python state machine), four phase-role agents + issue-triager, checks/role_guard.py PreToolUse hook, thin /start-slice refactor with --legacy escape hatch, and settings.json hook registration. Closes under legacy serial protocol; the compressed dispatch path it installs becomes the dogfood target for Slice B (Part 0 ADR). Audit-finding F1/F3/F4/F5 prevention mechanisms are present-by-construction but exercised only by Slice B's compressed execution. Authorized by compression-infrastructure-bootstrap; Part 0 ratification deferred to Slice B."
  - id: compression/orchestrator-hardening
    added: 2026-04-19
    intent: "Fix the three orchestrator defects surfaced by housekeeping/post-slice-a-tidy's dogfood run: (1) BLOCKER `--permission-mode` missing from dispatch_agent subprocess command, auto-denying inner Write/Edit; (2) BLOCKER brief text lost between init_new_slice and run_phase_loop, so Phase 1 writer runs without user intent; (3) LOW test_slice_orchestrator_state_machine tests couple to real slice.yaml. Ships on legacy serial protocol (bootstrap — fixing the compressed dispatcher itself); the resulting compressed path is ready for the next slice to dogfood. Out of scope: findings #3 (stderr), #4 (writer feature-scan), #5 (envelope schema); sweep #20 stale-test Findings §1/§3."
  - id: compression/slice-1-foundation
    added: 2026-04-20
    intent: "Foundation slice of the pipeline-hardening program (design doc 2026-04-20-compression-pipeline-hardening-design.md section 5). Resolve A1 (subagent sensitive-file gate on .claude/current-slice/**) via three-spike empirical test, commit to Path X (settings/flags) or Path Y (orchestrator-owned artifact writes) per spike outcome. Wire checks/role_guard.py into .claude/settings.json as PreToolUse hook for Write|Edit|MultiEdit|NotebookEdit (A3). Split dispatch_agent into dispatch_phase_agent / dispatch_triager with distinct return contracts (B1, B17). Extend _parse_structured_tail to accept multi-line pretty JSON tails via brace-balanced backward scan (B5). Replace capture_output with Popen tee-pump streaming child stderr live with [phase-N-role|slice-id] prefix (D3 brought forward). Rename debug log filenames to <slice-id-slug>-phase-<n>-<role>-<timestamp>.log. Exit when a trivial slice runs all four phases autonomously via the orchestrator, exits 0, produces sweep-notes.md. Out of scope: Slices 2 and 3 of the hardening program (state-machine, serialization, multi-instance, result JSON, indexed logs)."
  - id: compression/slice-2-state-machine
    added: 2026-04-20
    intent: "Slice 2 of the pipeline-hardening program (design doc 2026-04-20-compression-pipeline-hardening-design.md §6). Close the orchestrator code-bug backlog covering state-machine durability (B10 close_slice integration on OK-from-Phase-4, B12 fail-loud on malformed slice.yaml, B13 SIGINT/SIGTERM clean-shutdown handler, B14 RE_DISPATCH persists current_phase before continue, B15 max-1 redispatch-per-phase cap), git reconciliation (B11 _git helper asserts returncode==0, B9 post-TimeoutExpired HEAD reconciliation against pre-dispatch HEAD), serialization (B3/B4 yaml.safe_load/safe_dump for brief+name round-trip, B6 PyYAML + schema-validated cluster parsing, B7 AGENT_ENVELOPE encoded as JSON list parsed by role_guard via json.loads), and phase-3 robustness (B16 empty-cluster guard with intent-envelope fallback, B2 per-cluster log capture even on fast-fail, B8 FAILED classification — transient/malformed/logic — with exponential backoff). One regression test per bug. PyYAML dep already added in Slice 1. Out of scope: Slice 3 multi-instance + observability (E1 lockfile, E2 PID-scoped role_guard, D1 indexed debug logs, D3 orchestrator-result.json, parallel-worktree integration test); Path Y/C agent-return-with-artifacts contract redesign (tracked separately after the A1 nested-context empirical gap observed 2026-04-20)."
  - id: compression/triager-superseded-test-heuristic
    added: 2026-04-21
    intent: "Iterate dispatch_triager + issue-triager prompt so a RAISE_ISSUE naming tests superseded by a firm contract the current slice just landed routes to ESCALATE_TO_USER instead of RE_DISPATCH-to-Phase-2. Pattern observed in compression/slice-3-observability-and-close-slice (memory triager_misroute_on_superseded_tests.md; concrete log compression-slice-3-observability-and-close-slice-phase-3-phase-3-implementer-20260420T194707Z.log). Scope: (1) new pure function detect_superseded_test_signal(summary, intent_text) in scripts/slice_orchestrator.py triggered by tokens supersede/superseded, INV-NNN (three-digit), and DC-N AND-gated on current-slice intent.md; (2) dispatch_triager reads the RAISE_ISSUE commit body via _git, reads current slice intent.md, and appends advisory supersession_hint to the triager inputs JSON; (3) one-sentence amendment to .claude/agents/issue-triager.md telling the triager to prefer ESCALATE_TO_USER with test-amendment-recommended rationale when the hint fires; (4) one-paragraph note in docs/operational-reference.md near the Phase Skill Guide. One new Phase-2 regression file tests/unit/test_triager_superseded_heuristic.py. No new ADR (single-incident prompt iteration; provisional ADR deferred until a second incident or the heuristic becomes an override). Out of scope: Path C empirical gap, compression slices C/D/F, general triager refactor, RE_DISPATCH cap (B15) tuning, adding/removing triager actions."
  - id: compression/phase-4-sweepnotes-required
    added: 2026-04-23
    intent: "Mechanical enforcement of audit follow-up phase-4-sweepnotes-required (compression design §8 D2, INV-008 DC-4). Two co-landed edits in scripts/slice_orchestrator.py close_slice only: (1) presence check that .claude/current-slice/integration/sweep-notes.md exists on disk before the sole slice: complete commit — absent → non-zero exit, stderr error, orchestrator-result.json status: FAILED with stable reason token, no stage/commit/wipe; (2) extend _git add surface at scripts/slice_orchestrator.py:1766-1770 to cover every path declared by .claude/agents/phase-4-integrator.md:9 — .claude/handoff.md, .claude/sweep.yaml, and .claude/sweep-results/ via git add -A (eliminates orphan-artifact pattern seen in commit a8d8f23). INV-008 DC-4 preserved: no new commit sites, close_slice remains sole producer of slice: complete; D1 idempotency preserved via _is_slice_already_closed short-circuit gating the presence check; D3 wipe and D4 resume matrix untouched. Out of scope: agent-prompt rewrites, ADR edits, general close_slice refactor, Slice C candidate-set hygiene (D3), Slice D envelope-immutability-guard (D1), Slice F rolling-window /status surfacing, Path C fleet-writes empirical gap, .claude/sweep-results/ content or schema."
  - id: compression/phase-1-handoff-stage-surface
    added: 2026-04-23
    intent: "Phase-1 symmetric analog of Slice E. Extend scripts/slice_orchestrator.py:commit_phase_handoff (lines 1441-1452) to stage the phase-1-writer's full declared write surface — BOTH .claude/current-slice/intent.md AND .claude/features/<feature>.yaml — alongside the existing handoff-phase-N.md stage. Per .claude/agents/phase-1-writer.md:9, both paths are the declared Phase-1 writes; today commit_phase_handoff stages only handoff-phase-N.md, producing chronic orphans: intent.md (evidence 8e619c3 amendment, 513b0de recovery, a3729cb manual persistence, f2ab0f3 seed) and .claude/features/<feature>.yaml (evidence a8d8f23 and dbea33c chore tail-commits). Feature-id resolves from slice.yaml id via the existing _slice_id() helper (segment before /). Each new stage guarded by `if path.exists(): _git(\"add\", str(path))` mirroring the existing pattern so Phases 2/3/4 remain no-ops by construction (those phases do not touch either path) and Phase-4's orchestrator-code skip at max_phase (INV-008 DC-4 primary enforcement) means this code never fires at the Phase-4 boundary. INV-008 DC-4 preserved: commit_phase_handoff remains a per-phase handoff-boundary staging function producing `handoff: phase N complete` commits only; close_slice remains sole `slice: complete` producer; no new commit sites introduced. INV-003 preserved: phase-1-writer agent contract unchanged; only the orchestrator's staging surface is brought into alignment with the agent's already-declared write surface. Mirror Slice E edit discipline — additive stage-list extension, not a rewrite; no `git add -A`; no file creation; no mkdir. Phase-2 writes FOUR RED tests: R1a intent.md stages when present, R1b features-file stages when present, R2a no-op when intent.md absent, R2b no-op when features-file absent. Out of scope: Slice C F2/candidate-set hygiene (pending /decision), close_slice edits (Slice E landed those), init_new_slice edits (distinct commit site — owns slice.yaml only), phase-1-writer agent-contract changes (.md:9 authoritative), feature-file or intent schema edits, generalised git add -A rewrites, Slice D envelope-immutability-guard (D1), Slice F rolling-window /status surfacing, Path C fleet-writes empirical gap, any new commit sites."
  - id: compression/lever-2-orchestrator-split
    added: 2026-04-25
    intent: "Compression Lever 2 (Part-8 §5/§10/§13.1 H2). Split the 2240-line scripts/slice_orchestrator.py monolith into a hexagonal package scripts/slice_orchestrator/{__init__,__main__,core,dispatch,lifecycle,resume,telemetry,git}.py. Pure structural refactor: zero behavioral diff, zero test-file edits, 746/746 pytest pass at close. Backward-compat surface preserved by __init__.py re-exports — every name currently top-level on slice_orchestrator (is_valid_slice_id, read_slice_state, dispatch_phase_agent, dispatch_triager, dispatch_phase_3, detect_superseded_test_signal, commit_phase_handoff, run_phase_loop, init_new_slice, close_slice, legacy_start_slice, main, AGENT_MODEL_CONFIG, INV_009_COST_THRESHOLD_USD, INV_009_TOKEN_THRESHOLD, PRICING_TABLE_*, ROLE_FOR_PHASE, ROLE_TO_PHASE, DEBUG_DIR, DEFAULT_TIMEOUT_HARD, PERMISSION_MODE, VALID_TRIAGER_ACTIONS, SLICE_ID_REGEX, _HeartbeatDaemon, plus the underscore-prefixed helpers test files reach into) keeps `import slice_orchestrator as so; so.<name>` resolving identically. CLI entry-point `python -m slice_orchestrator` (and the path form invoked by /start-slice) preserved with the same --brief/--resume/--legacy arg surface. Path-string updates in commands/claude-code/start-slice.md, commands/claude-code/start-slice-legacy.md, docs/operational-reference.md (env-var Source column), and docs/ARCHITECTURE.md (invariant-check `target:` blocks) are in-envelope and required for accuracy after the path change. ADRs are append-only and out-of-envelope: their historical scripts/slice_orchestrator.py:NNN citations stay frozen by design. Estimated $3-5 / slice savings (180-300k cache_creation cut on orchestrator-touching slices) — measured on the next orchestrator-touching slice via Track-0 result.json. Out of scope: any test-file edit (a test diff signals broken refactor), invariant-comment colocation in code (H3 — separate slice), test-mirror restructure (H4 — gradual discipline), per-phase orientation (M0 — Lever 3, follows this), API digests (M0.5 — Lever 4), Read-cap and Bash-cap prompt prefixes (M3+M2 — Lever 5), subagent dispatch discipline (S1+S3 — Lever 6), doc-port layer (H1 — deferred until 2-3 adapters exist), L-008/L-009 follow-ons, sweep.yaml control keys, Slice C/D/F compression work, ADR file edits."
  - id: compression/lever-X-knowledge-index
    added: 2026-04-25
    intent: "Slice 1 of the knowledge-substrate program (design doc 2026-04-25-knowledge-substrate-design.md). Ship scripts/cairn_query/ — extractor (markdown → pydantic typed records) + kuzudb-backed graph storage + cairn_query CLI (typer) + CI round-trip validator. Operator-only consumer; no FastMCP server, no agent integration. Seven entity types (Invariant/Decision/Lesson/SpecSection/OpRule/Feature/Slice) plus the BINDS path-binding inverse view. Closes when full pytest passes, CI validator round-trips the current corpus, and cairn_query path-bindings <known-path> returns correct records for ≥3 sampled paths. Out of scope: FastMCP adapter (Slice 2), phase-agent integration (Slice 2/3), pre-wipe artifact preservation (sibling slice), ADR creation (cairn-substrate-and-fastmcp lands in Slice 2)."
