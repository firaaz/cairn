id: substrate
name: "Substrate — orchestrator/hook plumbing fixes"
intent: "Substrate-level paper-cuts and bugs in the slice pipeline plumbing — scope-guard allowlists, hook subject regexes, orchestrator phase-boundary staging, documented invocations. Distinct from housekeeping (drift cleanup) and from feature-level work in that the touches are to the methodology substrate itself."
shaped-from: "docs/plans/2026-05-02-substrate-papercut-bundle-design.md"
created: 2026-05-02
slices:
  - id: substrate/papercut-bundle
    added: 2026-05-02
    intent: "Three single-line substrate paper-cuts from the 2026-05-02 sweep, bundled because each touches a disjoint module: (1) checks/scope-guard.sh admin-allowlist case adds .claude/d1-bypasses.log and .claude/d3-bypasses.log so Write/Edit on bypass logs exits 0 without EXPAND_ENVELOPE=1 or Bash-heredoc; (2) commands/claude-code/integration-sweep.md changes documented invocation from 'python3 scripts/integration_gate.py' to 'uv run python scripts/integration_gate.py' (gate imports pydantic, .venv-only); (3) scripts/verify_handoff.sh check (c) accepts 'sweep: ' as a fourth commit-subject prefix and updates the 'expected one of:' error string. Two regression tests (scope-guard parametrized over both logs; verify_handoff against a sweep: HEAD); paper-cut #2 has no test (pure doc). Out of scope: integration_gate.py internals, pre-commit hook chain extension, issue #26 (next slice substrate/phase-2-skeptic-stage-surface), and pre-existing reds tracked elsewhere. Sweep paper-cut #3 (malformed sweep.yaml) reclassified out of scope per design plan: pre-fix data from commit 6cfa4d0, not an active bug. Invariants touched: none."
  - id: substrate/phase-2-staging-untracked-enumeration
    added: 2026-05-02
    issue: 26
    severity: S1
    intent: "Issue #26 follow-up. The partial fix at scripts/slice_orchestrator/lifecycle.py:232-243 (commit ae9e6c8) discovers Phase-2 test writes via 'git diff --name-only <phase_1_boundary_sha> -- tests/unit/'. git diff excludes UNTRACKED files, so a brand-new test file the skeptic creates for the first time on a slice is untracked at the moment the Phase-2 boundary commit is built and recreates the original leak for greenfield test files. Fix: extend the same current_phase==2 staging block to additionally enumerate untracked paths via 'git ls-files --others --exclude-standard -- tests/unit/', union with the existing diff-derived set, preserve the path.exists() idempotency guard. INV-008 DC-3 (idempotent close) and DC-4 (single phase-boundary commit) hold by construction — additive content widening of the existing Phase-2 commit, no new commits emitted, empty-input is a no-op. Verification: existing R1–R4 cases in tests/unit/test_phase_2_handoff_staging_surface.py (in tree at af0b5e0) must remain green; new R5 case covers an untracked test file at the Phase-1 boundary becoming staged at the Phase-2 boundary commit (RED against current ae9e6c8, GREEN after the widening). Self-application bisect anchor: the Phase-2 boundary commit on this slice itself must contain the new R5 test file, since untracked-at-discovery-time is exactly what the fix exists to handle. Out of scope: any phase other than 2; test paths outside tests/unit/; the Phase-1 boundary SHA discovery mechanism; squash-merge handling (L-015 / substrate Slice 4); pre-existing reds queued for post-INV-008 housekeeping. Invariants touched: INV-008 (preserved, not changed)."
  - id: substrate/phase-2-skeptic-stage-surface
    added: 2026-05-02
    issue: 26
    severity: S1
    intent: "Issue #26 — phase-2-skeptic stage-surface leak. Extend commit_phase_handoff in scripts/slice_orchestrator/lifecycle.py so that when current_phase==2, the staging set additionally includes every path under tests/unit/ whose state diverges (added or modified) from the Phase-1 boundary commit, guarded by path.exists() for idempotency. Discovery is diff-based (git diff --name-only <phase_1_boundary> -- tests/unit/), not slug-glob — robust to test-naming drift. Phase 2 RED at tests/unit/test_phase_2_handoff_staging_surface.py with four cases: R1 single test file staged; R2 three mixed-naming files all staged (deliberately includes a non-slug-named file to break naming-glob assumption); R3 zero test files preserves existing commit shape (handoff-phase-2.md only); R4 test file plus handoff-phase-2.md modification both staged in the same Phase-2 commit. INV-008 preservation: DC-3 idempotency held by additive stage-list + path.exists() guard; DC-4 phase-boundary commit shape held by widening the existing commit's content rather than emitting a second commit. Out of scope: Phase-3 staging (handles its own writes via existing path); Phase-4 staging (already fixed by a8d8f23); any change to commit count or commit subject; the Phase-1 boundary SHA discovery mechanism (read from existing orchestrator state). Symmetric closure of the leak that a8d8f23 patched on the Phase-4 side. Invariants touched: INV-008 (preserved, not changed)."
