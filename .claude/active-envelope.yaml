# Operator envelope for write-path enforcement in this worktree.
# role_guard.py reads this file when AGENT_ROLE is unset and enforces
# write paths against `paths`. Set when starting feature work; clear
# (mode: off) when returning to ad-hoc / cross-cutting work.
#
# Note: regex strings are matched against the tool path AFTER normalization
# to repo-root-relative form (gh#35 repair). Anchor with ^.
#
# Active feature: carrier-hierarchy-refocus (intent execution-scope).

mode: operator
paths:
  - ^docs/adr/.*
  - ^docs/ARCHITECTURE\.md$
  - ^docs/roadmap\.md$
  - ^docs/operational-reference\.md$
  - ^docs/operator-field-notes-.*\.md$
  - ^docs/dogfood-log\.md$
  - ^CLAUDE\.md$
  - ^\.claude/handoff\.md$
  - ^\.claude/active-envelope\.yaml$
  - ^\.claude/skills/.*
  - ^\.claude/agents/.*
  - ^\.claude/skill-runs/carrier-hierarchy-refocus/.*
  - ^checks/.*
  - ^scripts/.*
  - ^tests/.*
  - ^commands/claude-code/.*
  - ^workflows/.*
